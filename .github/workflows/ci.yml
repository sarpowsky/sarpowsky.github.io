name: CI

# Runs on every pull request and on any branch push that is not main.
# main is covered by the deploy workflow, which runs the same gates before
# publishing, so this avoids duplicating work on the default branch.
on:
  pull_request:
  push:
    branches-ignore: [main]

# A newer push to the same branch cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Format, type-check, build, links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # `npm ci` installs exactly the lockfile, so CI can never build against
      # a different dependency tree than the one committed.
      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      # Validates TypeScript *and* every content collection against its schema,
      # so a malformed Markdown frontmatter fails here rather than in production.
      - name: Type-check and validate content
        run: npm run check

      - name: Build
        run: npm run build:fast

      - name: Verify internal links and assets
        run: npm run check:links

      - name: Upload build output
        uses: actions/upload-artifact@v7
        with:
          name: dist-${{ github.sha }}
          path: dist
          retention-days: 7

  accessibility:
    name: Accessibility audit
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build:fast

      # Accessibility is asserted as a hard gate because it is deterministic.
      # Performance is collected for visibility but not enforced, since runner
      # timing varies enough to make a strict budget flaky.
      - name: Run Lighthouse
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: .lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true
